$schema: http://json-schema.org/draft-07/schema#
title: lab-note
type: object
required: [type, experiment_id, date]
properties:
  type:
    const: lab-note
  experiment_id:
    type: string
    pattern: "^[0-9A-F]{8}$"
    description: "Adler-32 hex uppercase, 8 char (idea C)"
  date:
    type: string
    format: date
  project_code:
    oneOf:
      - type: string
      - type: "null"
  activity_type:
    # Free-form: what counts as an activity depends on the field.
    oneOf:
      - type: string
      - type: "null"
  protocol:
    oneOf:
      - type: string
      - type: "null"
  samples_processed:
    oneOf:
      - type: integer
      - type: "null"
  success_count:
    oneOf:
      - type: integer
      - type: "null"
  material:
    # Free-form: what a sample is made of depends on the field.
    oneOf:
      - type: string
      - type: "null"
