$schema: http://json-schema.org/draft-07/schema#
title: concept
type: object
required: [type, title]
properties:
  type:
    const: concept
  title:
    type: string
  stage:
    enum: [seed, zettel, claim]
  relations:
    type: object
    description: "Typed-link DAG (idea D — van Krieken)"
    properties:
      isA:
        type: array
        items:
          type: string
      partOf:
        type: array
        items:
          type: string
      studies:
        type: array
        items:
          type: string
      usesMethod:
        type: array
        items:
          type: string
      contradicts:
        type: array
        items:
          type: string
      extends:
        type: array
        items:
          type: string
