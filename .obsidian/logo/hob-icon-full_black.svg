    <use
       href="#star"
       transform="matrix(0.7,0,0,0.7,470.06061,56.787879)"
       id="use27" />
    <!-- Capping the top-left tip of B -->
    <use
       href="#star"
       transform="matrix(0.8,0,0,0.8,498.06061,106.78788)"
       id="use28" />
    <!-- Nestled INSIDE the top loop counter of B -->
    <use
       href="#star"
       transform="matrix(0.5,0,0,0.5,545.06061,76.787879)"
       id="use29" />
    <!-- Hugging the top outer curve of B -->
