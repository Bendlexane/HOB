  <defs
     id="defs15">
    <!-- 1. Gradient for H: Early Morning & Hint of Day (Alba/Mattina -> Accenno Giorno) -->
    <linearGradient
       id="gradientH"
       x1="157.3588"
       y1="72.757293"
       x2="283.83409"
       y2="199.23259"
       gradientTransform="matrix(0.6799747,0,0,1.470643,-49.939394,-63.212121)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#4b4e8c"
         id="stop1" />
      <!-- Alba Purple -->
      <stop
         offset="50%"
         stop-color="#ffb88c"
         id="stop2" />
      <!-- Early Morning Peach -->
      <stop
         offset="100%"
         stop-color="#6ba1d8"
         id="stop3" />
      <!-- Accenno di Giorno Sky Blue -->
    </linearGradient>
    <!-- 2. Gradient for O: Full Day & Sunset (Giorno -> Tramonto) -->
    <linearGradient
       id="gradientO"
       x1="262"
       y1="112"
       x2="438"
       y2="288"
       gradientUnits="userSpaceOnUse"
       gradientTransform="translate(-49.939394,-63.212121)">
      <stop
         offset="0%"
         stop-color="#6ba1d8"
         id="stop4" />
      <!-- Sky Blue (Giorno) -->
      <stop
         offset="30%"
         stop-color="#a8cff3"
         id="stop5" />
      <!-- Soft Blue -->
      <stop
         offset="70%"
         stop-color="#cf9a7d"
         id="stop6" />
      <!-- Sunset Gold -->
      <stop
         offset="100%"
         stop-color="#b76e63"
         id="stop7" />
      <!-- Sunset Terracotta -->
    </linearGradient>
    <!-- 3. Gradient for B: Dusk & Night (Sera -> Notte) -->
    <linearGradient
       id="gradientB"
       x1="705.71413"
       y1="76.871069"
       x2="839.34048"
       y2="210.49741"
       gradientTransform="matrix(0.71842121,0,0,1.3919411,-49.939394,-63.212121)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#cf9a7d"
         id="stop8" />
      <!-- Sunset Gold (Accenno di Tramonto) -->
      <stop
         offset="12%"
         stop-color="#b76e63"
         id="stopSunset2" />
      <!-- Sunset Terracotta -->
      <stop
         offset="28%"
         stop-color="#5d4a78"
         id="stop9" />
      <!-- Warm Dusk Purple (Sera) -->
      <stop
         offset="42%"
         stop-color="#4a3a6b"
         id="stopDusk2" />
      <!-- Deep Dusk Purple -->
      <stop
         offset="50%"
         stop-color="#1a2151"
         id="stop10" />
      <!-- Twilight Indigo/Navy (Night starts here) -->
      <stop
         offset="75%"
         stop-color="#0b1026"
         id="stop11" />
      <!-- Night Obsidian Navy (Notte) -->
      <stop
         offset="100%"
         stop-color="#080c1e"
         id="stopNightEnd" />
