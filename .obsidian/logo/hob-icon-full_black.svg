    <circle
       cx="300.06061"
       cy="136.78787"
       r="75"
       stroke="url(#gradientO)"
       stroke-width="26"
       fill="none"
       id="circle19"
       style="stroke:url(#gradientO)" />
    <!-- Yellow Sun (Sole Mezzo Tagliato) - Shifted exactly to the outer border of the O ring -->
    <g
       transform="rotate(135,103.54114,86.698002)"
