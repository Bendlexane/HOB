      <path
         d="m -15.382938,-1.0410146 c 0,-8.836562 6.6541475,-14.9374254 15.49070326,-14.9374254 8.83655584,0 16.06421074,6.1360482 16.06421074,14.9726102 l -4.87344,0.62184636 -3.5034889,0.38875281 -3.8255528,0.22608626 -3.26995951,0.085234 -5.16063639,-0.092873 -3.8854221,-0.30936949 -1.6749673,-0.19655231 -1.823159,-0.21394206 -1.563931,-0.22189949 z"
         fill="#ffd24d"
         filter="drop-shadow(0 0 6px rgba(255, 210, 77, 0.8))"
         id="path20"
         sodipodi:nodetypes="csccccccccccc" />
    </g>
    <!-- Inner Sprite Core / Glowing Hearth Flame inside the 'O' with Keyhole Cut-out -->
    <path
       d="m 300.06061,96.787879 c -15,25.000001 -25,40.000001 -25,55.000001 0,15 11,27 25,27 14,0 25,-12 25,-27 0,-15 -10,-30 -25,-55.000001 z m -2.5,49.330001 a 5,5 0 1 1 5,0 l 2.5,11.67 h -10 z"
       fill="url(#warmGlow)"
       filter="drop-shadow(0 0 12px rgba(255, 230, 192, 0.8))"
