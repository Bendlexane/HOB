    <!-- ================= LETTER B (Sera & Notte) ================= -->
    <path
       d="M 470.06061,56.787879 V 216.78788 c 45,0 70,-15 70,-40 0,-15 -12,-25 -40,-25 28,0 36,-10 36,-25 0,-20 -21,-70.000001 -66,-70.000001 z"
       stroke="url(#gradientB)"
       stroke-width="26"
       stroke-linejoin="round"
       stroke-linecap="round"
       fill="none"
       id="path22"
       style="stroke:url(#gradientB)" />
    <!-- Full Moon (Luna Piena - Semicerchio) - Shifted inward to fit exactly on the outer boundary curve of B -->
