      <path
         d="m -10.947603,0.14260277 c 0.0019,-6.49780287 5.2699319,-11.76429577 11.7677305,-11.76429577 6.4977986,0 11.7574235,4.9765248 11.7593175,11.47432762 L 6.2942781,1.025126 1.0642118,1.4804073 -4.1052713,1.2369976 -7.4403975,0.79308722 Z"
         fill="#ffffff"
         filter="drop-shadow(0 0 4px rgba(255, 255, 255, 0.9))"
         id="path23"
         style="stroke-width:1.47097"
         sodipodi:nodetypes="cscccccc" />
    </g>
    <!-- ================= INTEGRATED NIGHT STARS (Hugging/Inside the letter strokes) ================= -->
    <use
